<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBO-ICT: Robot</title>
    <link rel="stylesheet" href="static/css/style.css"> <!-- Link to external CSS file -->
    <script src="static/javascript/buttons.js" defer></script> <!-- Link to external JavaScript file  -->
    <script src="static/javascript/script.js" defer></script> <!-- Link to another external JavaScript file  -->
</head>
<body>
    <div class="top-bar">
        <img src="static/images/logo.png" alt="HvA" class="logo"> <!-- HvA logo image -->
        <button class="btn" onclick="window.location.replace('./index.html');" >home</button> <!-- Button to navigate back to home page -->
    </div>

    <div class="menu">
        <h1>HBO-ICT: Smart Robots</h1> <!-- Title of the page -->
    </div>

    <div class="container">
        <div class="arrow-container">
            <!-- Arrow buttons for robot movement -->
            <button class="arrow-btn arrow-up"></button>
            <div class="left-right-container">
                <button class="arrow-btn arrow-left"></button>
                <div class="spacer"></div>
                <button class="arrow-btn arrow-down"></button>
                <div class="spacer"></div>
                <button class="arrow-btn arrow-right"></button>
            </div>
        </div>
    </div>

    <button class="btn" id="toggleDrawer">See connection</button> <!-- Button to toggle connection information -->
    <div id="drawer" class="connection-display-container">
        <h1>Robot Connection status</h1>
        <span id="not-connected">Not Connected :(</span> <!-- Displayed when robot is not connected -->
        <div id="is-connected">
            <!-- Displayed when robot is connected -->
            <div id="connected-to?" class="information-container">
                <span class="information-span">Connected to</span>
                <span id="connected-to?-name" >Kees</span> <!-- Name of the connected robot -->
            </div>
            <div id="connected-speed?" class="information-container">
                <span class="information-span">Connection speed:</span>
                <span id="connected-speed?-value">10</span> <!-- Connection speed value -->
            </div>
        </div>
    </div>

</body>
</html>
