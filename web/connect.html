<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect to Device</title>
    <link rel="stylesheet" href="static/css/connect.css">
    <link rel="stylesheet" href="static/css/style.css">
    <script src="static/javascript/connect.js" defer></script>
    <script src="static/javascript/script.js" defer></script>
    <script src="static/javascript/NavLoader.js" defer></script>
</head>
<body>
    <div class="top-bar">
        <a href="./index.html">
            <img src="static/images/logo.png" alt="HvA" class="logo">
        </a>
    </div>

    <div class="menu">
        <h1>HBO-ICT: Connect to Device</h1>
    </div>
    
    <div id="navbar"></div>

    <div class="wrapper">
        <div class="robot-list-container-wrapper">
            <h2 class="robot-list-header">List of Active Robots</h2>
            <ul class="robot-list-container"></ul>
        </div>
        <input type="text" class="robot-name-input" placeholder="Enter Robot Name">
        <button class="btn connect" onclick="connect()">Connect to Robot</button>
    </div>

    <!-- STANDRARD ON EVERY PAGE -->
    <button class="btn close" id="toggleDrawer">See connection</button>
    <div id="drawer" class="connection-display-container close" style="left: 65%">
        <h1>Robot Connection status</h1>
        <span id="not-connected">Not Connected :(</span>
        <div id="is-connected">
            <div id="connected-to?" class="information-container">
                <span class="information-span">Connected to</span>
                <span id="connected-to?-name" >Kees</span>
            </div>
            <div id="connected-speed?" class="information-container">
                <span class="information-span">Connection speed:</span>
                <span id="connected-speed?-value">10</span>
            </div>
        </div>
    </div>
</body>
</html>
