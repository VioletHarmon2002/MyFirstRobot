<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./static/css/blockly.css">
    <title>HBO-ICT: Robot</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/blockly.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="static/javascript/script.js" defer></script>
</head>
<body>
    <div class="top-bar" style="height: auto;">
        <a href="./index.html">
            <img src="static/images/logo.png" alt="HvA" class="logo">
        </a>
        <!-- <button class='btn' onclick="closeFlyout()" id="toggleFlyout">close</button>
        <button class="btn" onclick="openFlyout()" >open</button> -->
    </div>
    <div class="flex-row">

        <div id="blocklyDiv" class="blocklyContainer" style="height: 80vh; width: 80%;"></div>
        <xml id="toolbox" style="display: none">
            <block type="move"></block>
            <block type="turn"></block>
            <!-- <block type="controls_if"></block> -->
            <!-- <block type="logic_compare"></block>
            <block type="math_number"></block> -->
            <block type="controls_repeat_ext">
                <value name="TIMES">
                  <shadow type="math_number">
                    <field name="NUM">10</field>
                  </shadow>
                </value>
              </block>
            <!-- <block type="math_arithmetic"></block> -->
            <block type="text"></block>
            <block type="print"></block>
            <block type="play_animation"></block>
            <block type="wait"></block>
            <block type="emote"></block>
        </xml>
        <div id="code_display_parent">
            <h1>Code:</h1>
            <div class="program_controlls flex-row" style="position: relative; bottom: 0px">
                <button class="control-btn program-direction-button" id="back-btn" onclick="testAsync()"><i class="fa fa-step-backward"></i></ibutton>
                <button class="control-btn" id="play-btn" onclick="play()"><i class="fa fa-play"></i></button>
                <button class="control-btn" id="pause-btn" onclick="pause()"><i class="fa fa-pause"></i></button>
                <button class="control-btn program-direction-button" id="forward-btn"><i class="fa fa-step-forward"></i></button>
            </div>
            <div id="code_display_element"></div>
        </div>
    </div>

    <!-- STANDRARD ON EVERY PAGE -->
    <button class="btn close" id="toggleDrawer">See connection</button>
    <div id="drawer" class="connection-display-container close" style="left: 65%">
        <h1>Robot Connection status</h1>
        <span id="not-connected">Not Connected :(</span>
        <div id="is-connected">
            <div id="connected-to?" class="information-container">
                <span class="information-span">Connected to</span>
                <span id="connected-to?-name" >Kees</span>
            </div>
            <div id="connected-speed?" class="information-container">
                <span class="information-span">Connection speed:</span>
                <span id="connected-speed?-value">10</span>
            </div>
        </div>
    </div>

        <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="./static/javascript/blockly.js"></script>
</body>
</html>
