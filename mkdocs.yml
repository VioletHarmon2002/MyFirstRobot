site_name: My First Robot
theme:
  name: material
  features:
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Switch to dark mode
      primary: teal
      accent: purple 
    - scheme: slate 
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
      primary: teal
      accent: teal

nav:
  - 🏠 Home: index.md
  - Device: 
    - 🔨 Setup:
      - Server: Device/Setup/server.md
    - ⌨ Code: 
      - Movement: Device/Code/movement.md
    - 💾 Database: 
      - Database: Device/Database/database.md
      - API Reference: Device/Database/reference.md
  
  - Process:
    - 📃 Conventions:
        - C++: Process/Conventions/cpp.md
        - HTML: Process/Conventions/html.md
        - CSS: Process/Conventions/css.md
        - JavaScript: Process/Conventions/javascript.md
    - 🔍 Learning Journals:
        - Joshua Ganga: Process/Learning Journals/joshua.md
        - Tim van Dantzig: Process/Learning Journals/tim.md
        - Tom Jonker: Process/Learning Journals/tom.md
        - Despoina Sfantou: Process/Learning Journals/despoina.md
        - Elizaveta Sabanova: Process/Learning Journals/elizaveta.md
        - Xander Tamis: Process/Learning Journals/xander.md
    - 📞 Meetings:
        - Gerald:
            - Nov 13, 2024: Process/Meetings/Gerald/13-11-2024.md
            - Nov 20, 2024: Process/Meetings/Gerald/20-11-2024.md
            - Dec 11, 2024: Process/Meetings/Gerald/11-12-2024.md
        - Bernardo:
            - Nov 22, 2024: Process/Meetings/Bernardo/22-11-2024.md
            - Dec 13, 2024: Process/Meetings/Bernardo/13-12-2024.md
  


markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

extra_css:
  - css/extra_style.css